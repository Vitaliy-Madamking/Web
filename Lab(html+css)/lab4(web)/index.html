<body>
    <h2>Сумма квадратов двух чисел</h2>
    <form id="myForm">
        <label for="firstValue">Первое число (firstValue):</label>
        <input type="number" id="firstValue" step="any" value="3" required>
        <br><br>

        <label for="secondValue">Второе число (secondValue):</label>
        <input type="number" id="secondValue" step="any" value="4" required>
        <br><br>

        <button type="button" id="calcBtn">Вычислить</button>
    </form>
    <p id="result"></p>
</body>
